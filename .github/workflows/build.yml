name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test

      - name: Pick version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build_app.sh "${{ steps.version.outputs.version }}"

      - name: Make DMG
        run: scripts/make_dmg.sh "${{ steps.version.outputs.version }}"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: SoundOutdoorEQ-${{ steps.version.outputs.version }}
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
