name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Version to publish as a release, like 1.0.0. Leave empty for a normal build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test

      - name: Pick version
        id: version
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          if [[ -n "$RELEASE_INPUT" ]]; then
            version="${RELEASE_INPUT#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release version must look like 1.0.0, got '$RELEASE_INPUT'" >&2
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build_app.sh "${{ steps.version.outputs.version }}"

      - name: Make DMG
        run: scripts/make_dmg.sh "${{ steps.version.outputs.version }}"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: SoundOutdoorEQ-${{ steps.version.outputs.version }}
          path: dist/*.dmg
          if-no-files-found: error

      # Creates the v<version> tag on this commit if it doesn't exist yet.
      - name: Publish release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Sound Outdoor EQ ${{ steps.version.outputs.version }}
          files: dist/*.dmg
          generate_release_notes: true
